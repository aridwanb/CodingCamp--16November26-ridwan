<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────────── HEADER ───────────────── -->
    <header class="topbar">
      <span class="app-title">Dashboard</span>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main class="grid">

      <!-- ───────────────── GREETING ───────────────── -->
      <section class="card greeting-card" aria-label="Greeting">
        <div class="greeting-text">
          <p id="greeting-msg" class="greeting-msg">Good morning!</p>
          <p id="datetime" class="datetime"></p>
        </div>
        <div class="name-row">
          <input
            id="name-input"
            type="text"
            placeholder="Enter your name…"
            maxlength="30"
            aria-label="Your name"
          />
          <button id="name-save" class="btn-primary">Save</button>
        </div>
      </section>

      <!-- ───────────────── FOCUS TIMER ───────────────── -->
      <section class="card timer-card" aria-label="Focus timer">
        <h2 class="card-title">Focus Timer</h2>
        <div class="timer-settings">
          <label for="timer-duration">Minutes:</label>
          <input
            id="timer-duration"
            type="number"
            min="1"
            max="99"
            value="25"
            aria-label="Timer duration in minutes"
          />
        </div>
        <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn-primary">Start</button>
          <button id="timer-stop" class="btn-secondary">Stop</button>
          <button id="timer-reset" class="btn-ghost">Reset</button>
        </div>
      </section>

      <!-- ───────────────── TO-DO LIST ───────────────── -->
      <section class="card todo-card" aria-label="To-do list">
        <h2 class="card-title">To-Do List</h2>

        <!-- Add task row -->
        <div class="todo-add-row">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task…"
            maxlength="120"
            aria-label="New task"
          />
          <button id="todo-add" class="btn-primary">Add</button>
        </div>

        <!-- Sort controls -->
        <div class="todo-sort-row">
          <span class="sort-label">Sort:</span>
          <button class="sort-btn active" data-sort="default">Default</button>
          <button class="sort-btn" data-sort="az">A–Z</button>
          <button class="sort-btn" data-sort="done">Done last</button>
        </div>

        <!-- Duplicate warning -->
        <p id="todo-dup-warn" class="warn-msg" aria-live="polite" hidden>
          ⚠️ That task already exists.
        </p>

        <!-- Task list -->
        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- ───────────────── QUICK LINKS ───────────────── -->
      <section class="card links-card" aria-label="Quick links">
        <h2 class="card-title">Quick Links</h2>

        <!-- Add link form -->
        <div class="link-add-form">
          <input
            id="link-name"
            type="text"
            placeholder="Label (e.g. YouTube)"
            maxlength="30"
            aria-label="Link label"
          />
          <input
            id="link-url"
            type="url"
            placeholder="https://…"
            aria-label="Link URL"
          />
          <button id="link-add" class="btn-primary">Add</button>
        </div>

        <!-- Link grid -->
        <div id="links-grid" class="links-grid" role="list"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
